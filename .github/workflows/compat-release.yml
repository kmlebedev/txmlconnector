name: Compat release

# C3/C9: build the drop-in C ABI library with Zig as the C toolchain for every
# target (docs/COMPATIBILITY.md). Linux and Windows are cross-built on one
# Linux host; macOS needs the macOS SDK and is built on a macOS runner. Every
# target is tested on its native runner, and the builds are reproducible
# (tools/cabi/zig_build.sh). A compat-v* tag publishes one release with all
# archives plus SHA256SUMS.
on:
  push:
    tags:
      - "compat-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIG_VERSION: "0.17.1"
  TXC_VERSION: "6.47.2.26.4"

jobs:
  build-cross:
    name: build linux+windows (zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Go tests (cgo wrapper, logs, PE normalizer)
        env:
          CGO_ENABLED: "1"
          CC: zig cc
        run: go test ./cmd/connector/... ./tools/cabi/...

      - name: Build linux-amd64, linux-arm64, windows-amd64
        run: tools/cabi/zig_build.sh dist linux-amd64 linux-arm64 windows-amd64

      - name: Reproducible (second build is byte-identical)
        run: |
          tools/cabi/zig_build.sh dist2 linux-amd64 linux-arm64 windows-amd64
          (cd dist && sha256sum */*.so */*.dll) > repro.sum
          (cd dist2 && sha256sum -c ../repro.sum)

      - name: Linux needs glibc <= 2.17
        run: |
          for t in linux-amd64 linux-arm64; do
            max=$(objdump -T "dist/$t/libtxmlconnector.so" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
            echo "$t: max GLIBC_$max"
            [ "$(printf '%s\n2.17\n' "$max" | sort -V | tail -1)" = "2.17" ]
          done

      - name: Windows exports match the reference DLL (names and ordinals 1-9)
        run: |
          # objdump output differs between binutils and LLVM: read the export
          # table with the Go tool and compare with the reference DLL.
          go run ./tools/cabi/pe-repro -exports dist/windows-amd64/txmlconnector64.dll | tee exports.txt
          go run ./tools/cabi/pe-repro -exports txmlconnector64-6.47.2.26.4.dll | diff - exports.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/linux-amd64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/linux-arm64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows-amd64
          path: dist/windows-amd64
          if-no-files-found: error

  test:
    name: test ${{ matrix.name }}
    needs: build-cross
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            lib: libtxmlconnector.so
            triple: x86_64-linux-gnu.2.17
            archive: txmlconnector-linux-amd64.tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            lib: libtxmlconnector.so
            triple: aarch64-linux-gnu.2.17
            archive: txmlconnector-linux-arm64.tar.gz
          - name: windows-amd64
            os: windows-latest
            lib: txmlconnector64.dll
            triple: x86_64-windows-gnu
            archive: txmlconnector-windows-amd64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: dist

      - name: C ABI test and C5 conformance
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            zig cc -target ${{ matrix.triple }} -I cmd/connector/include -o dist/abi_test.exe \
              cmd/connector/testdata/abi_test.c dist/${{ matrix.lib }}
            zig cc -target ${{ matrix.triple }} -I cmd/connector/include -o dist/abi_conformance.exe \
              cmd/connector/testdata/abi_conformance.c
            PATH="$PWD/dist:$PATH" ./dist/abi_test.exe "dist/${{ matrix.lib }}"
            PATH="$PWD/dist:$PATH" ./dist/abi_conformance.exe "dist/${{ matrix.lib }}" cmd/connector/testdata/cabi_scenarios.json
          else
            zig cc -target ${{ matrix.triple }} -I cmd/connector/include -o dist/abi_test \
              cmd/connector/testdata/abi_test.c -Ldist -ltxmlconnector -ldl
            zig cc -target ${{ matrix.triple }} -I cmd/connector/include -o dist/abi_conformance \
              cmd/connector/testdata/abi_conformance.c -ldl
            LD_LIBRARY_PATH=dist ./dist/abi_test "dist/${{ matrix.lib }}"
            LD_LIBRARY_PATH=dist ./dist/abi_conformance "dist/${{ matrix.lib }}" cmd/connector/testdata/cabi_scenarios.json
          fi

      - name: Old glibc (CentOS 7, glibc 2.17)
        if: matrix.name == 'linux-amd64'
        run: |
          docker run --rm -v "$PWD:/w" -w /w centos:7 \
            env LD_LIBRARY_PATH=dist ./dist/abi_conformance "dist/${{ matrix.lib }}" cmd/connector/testdata/cabi_scenarios.json

      - name: Package archive
        shell: bash
        run: |
          cd dist
          {
            echo "version: $TXC_VERSION"
            echo "commit: $GITHUB_SHA"
            echo "target: ${{ matrix.name }}"
            echo "toolchain: go $(grep '^go ' ../go.mod | cut -d' ' -f2), zig $ZIG_VERSION (${{ matrix.triple }})"
            echo "abi: txmlconnector64.dll-compatible C ABI (9 exports)"
          } > VERSION.txt
          cp ../README.md README.md
          sha256sum ${{ matrix.lib }} > SHA256SUMS.lib
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "${{ matrix.archive }}" txmlconnector64.dll txmlconnector.h VERSION.txt README.md SHA256SUMS.lib
          else
            tar -czf "${{ matrix.archive }}" libtxmlconnector.so libtxmlconnector64.so txmlconnector.h VERSION.txt README.md SHA256SUMS.lib
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.name }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  macos:
    name: build+test macos (zig)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build macos-arm64, macos-amd64 (zig + macOS SDK)
        run: |
          tools/cabi/zig_build.sh dist macos-arm64 macos-amd64
          tools/cabi/zig_build.sh dist2 macos-arm64 macos-amd64
          (cd dist && shasum -a 256 */*.dylib) > repro.sum
          (cd dist2 && shasum -a 256 -c ../repro.sum)

      - name: C ABI test and C5 conformance (arm64)
        run: |
          d=dist/macos-arm64
          clang -I cmd/connector/include -o $d/abi_test cmd/connector/testdata/abi_test.c -L$d -ltxmlconnector
          clang -I cmd/connector/include -o $d/abi_conformance cmd/connector/testdata/abi_conformance.c
          DYLD_LIBRARY_PATH=$d $d/abi_test $d/libtxmlconnector.dylib
          DYLD_LIBRARY_PATH=$d $d/abi_conformance $d/libtxmlconnector.dylib cmd/connector/testdata/cabi_scenarios.json

      - name: C ABI test and C5 conformance (amd64 via Rosetta)
        run: |
          softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          d=dist/macos-amd64
          clang -arch x86_64 -I cmd/connector/include -o $d/abi_test cmd/connector/testdata/abi_test.c -L$d -ltxmlconnector
          clang -arch x86_64 -I cmd/connector/include -o $d/abi_conformance cmd/connector/testdata/abi_conformance.c
          arch -x86_64 env DYLD_LIBRARY_PATH=$d $d/abi_test $d/libtxmlconnector.dylib
          arch -x86_64 env DYLD_LIBRARY_PATH=$d $d/abi_conformance $d/libtxmlconnector.dylib cmd/connector/testdata/cabi_scenarios.json

      - name: Package archives
        run: |
          for t in macos-arm64 macos-amd64; do
            d=dist/$t
            {
              echo "version: $TXC_VERSION"
              echo "commit: $GITHUB_SHA"
              echo "target: $t"
              echo "toolchain: go $(grep '^go ' go.mod | cut -d' ' -f2), zig $ZIG_VERSION + macOS SDK"
              echo "abi: txmlconnector64.dll-compatible C ABI (9 exports)"
            } > $d/VERSION.txt
            cp README.md $d/README.md
            (cd $d && shasum -a 256 libtxmlconnector.dylib > SHA256SUMS.lib &&
              tar -czf ../txmlconnector-$t.tar.gz libtxmlconnector.dylib libtxmlconnector64.dylib txmlconnector.h VERSION.txt README.md SHA256SUMS.lib)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: compat-macos-arm64
          path: dist/txmlconnector-macos-arm64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: compat-macos-amd64
          path: dist/txmlconnector-macos-amd64.tar.gz
          if-no-files-found: error

  release:
    name: release
    needs: [test, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/compat-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: compat-*
          path: release
          merge-multiple: true

      - name: SHA-256 over release archives
        shell: bash
        run: |
          cd release
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
          ls -l

      - name: Publish one GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          fail_on_unmatched_files: true
